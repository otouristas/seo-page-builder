<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g1" cx="20%" cy="10%" r="60%"><stop offset="0" stop-color="#c7ff3b" stop-opacity=".35"/><stop offset="1" stop-color="#c7ff3b" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="90%" cy="90%" r="60%"><stop offset="0" stop-color="#7c9bff" stop-opacity=".35"/><stop offset="1" stop-color="#7c9bff" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".14"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#0a0f1e"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <g transform="translate(80 90)">
    <rect x="0" y="26" width="10" height="10" rx="2" fill="#2a3559"/><rect x="13" y="16" width="10" height="20" rx="2" fill="#7c9bff"/><rect x="26" y="0" width="10" height="36" rx="2" fill="#c7ff3b"/>
    <text x="50" y="30" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#f4f6fb">Rankframe</text>
  </g>
  <text x="80" y="290" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="700" fill="#f4f6fb">See where your page lands</text>
  <text x="80" y="370" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="700" fill="#c7ff3b">on Google. Then move it.</text>
  <text x="80" y="440" font-family="Inter, Arial, sans-serif" font-size="26" fill="#8b93a7">Paste a URL → on-page audit → a Google-like SERP scene → plays that lift you.</text>
  <g transform="translate(760 470)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="360" height="110" rx="12" fill="#ffffff"/>
    <rect x="0" y="0" width="360" height="110" rx="12" fill="none" stroke="#c7ff3b" stroke-width="2"/>
    <text x="20" y="34" font-size="14" fill="#202124">yourdomain.com › page</text>
    <text x="20" y="62" font-size="20" fill="#1a0dab">Your page — modeled #2</text>
    <text x="20" y="88" font-size="14" fill="#4d5156">Three plays applied. Title, FAQ schema, internal links.</text>
  </g>
